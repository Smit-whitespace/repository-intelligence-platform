[project]
name = "local-openclaw"
version = "0.1.0"
description = "Repository Intelligence Platform — offline-first, repository-aware AI coding assistant"
requires-python = ">=3.12,<3.13"

[project.urls]
Homepage = "https://github.com/Smit-whitespace/repository-intelligence-platform"
Documentation = "https://github.com/Smit-whitespace/repository-intelligence-platform/tree/main/docs"
dependencies = [
    "chromadb==1.0.20",
    "fastapi==0.138.1",
    "httpx==0.28.1",
    "ollama==0.6.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "structlog==26.1.0",
    "tiktoken==0.13.0",
    "uvicorn[standard]==0.49.0",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
    "chromadb==1.0.20",
]
